# Pushing a tag like v1.1.0 builds the signed release APK in the Dockerfile and publishes a GitHub
# release with it (tags with a "-", like v1.1.0-rc1, become pre-releases). See docs/releasing.md.
#
# Needs these repository secrets (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64    the release keystore, base64:  base64 -w0 better-red.jks
#   ANDROID_KEYSTORE_PASSWORD  its password
#   ANDROID_KEY_ALIAS          the key's alias (e.g. better-red)
#   ANDROID_KEY_PASSWORD       optional: the key's password, if different from the keystore's
name: "Release"

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tagged-release:
    name: "ReleaseBuild"
    runs-on: "ubuntu-latest"
    permissions:
      contents: write # create the release and upload the APK

    steps:
      - uses: actions/checkout@v4

      - name: "Check the tag matches versionName"
        run: |
          version="$(make -s version)"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME doesn't match versionName $version in app/build.gradle.kts"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: "Signing key"
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::the ANDROID_KEYSTORE_BASE64 secret is missing (see docs/releasing.md)"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - uses: docker/setup-buildx-action@v3

      - name: "Build"
        uses: docker/build-push-action@v6
        env:
          BR_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BR_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          BR_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}
        with:
          context: .
          file: Dockerfile
          target: apk
          outputs: type=local,dest=dist
          secret-files: |
            keystore=${{ runner.temp }}/release.jks
          secret-envs: |
            keystore_password=BR_KEYSTORE_PASSWORD
            key_alias=BR_KEY_ALIAS
            key_password=BR_KEY_PASSWORD
          cache-from: type=gha
          cache-to: type=gha,mode=min

      - name: "Remove the signing key"
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: "Check the APK is signed"
        run: |
          ls -l dist
          test -f "dist/better-red-$VERSION.apk" || (echo "::error::no signed APK was built" && exit 1)

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}
        run: |
          flags=""
          case "$tag" in *-*) flags="--prerelease" ;; esac
          {
            echo "Install \`better-red-$VERSION.apk\` on Android 10 or newer."
            echo
            echo "Signing certificate:"
            echo '```'
            cat dist/signing-certificate.txt
            echo '```'
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$tag" \
              --title="Better Red $VERSION" \
              --notes-file "$RUNNER_TEMP/notes.md" \
              --generate-notes \
              --verify-tag $flags

      - name: Upload Assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}
        run: |
          gh release upload "$tag" "dist/better-red-$VERSION.apk" dist/SHA256SUMS
